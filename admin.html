<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><link rel="icon" href="favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HJ Shop Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div id="login" class="screen"><div class="login-box"><div class="brand">HJ SHOP</div><h1>Admin Panel</h1><p>Website control করতে লগইন করুন</p><form id="loginForm"><input required type="email" name="email" placeholder="Admin email"><input required type="password" name="password" placeholder="Password"><button>Login</button></form><small id="loginMsg"></small></div></div><div id="app" hidden><header><b>HJ SHOP — Admin</b><button id="logout">Logout</button></header><div class="layout"><aside><button data-tab="dashboard">📊 Dashboard</button><button data-tab="products">🛍️ Products</button><button data-tab="banners">🖼️ Banner & Home</button><button data-tab="settings">⚙️ Website Settings</button><button data-tab="orders">📦 Orders</button></aside><main><section id="dashboard" class="tab"><h1>Dashboard</h1><div class="cards"><div><span>Products</span><b id="statProducts">0</b></div><div><span>Orders</span><b id="statOrders">0</b></div><div><span>Pending</span><b id="statPending">0</b></div></div><p>বাম পাশের মেনু থেকে পুরো website নিয়ন্ত্রণ করুন।</p></section><section id="products" class="tab" hidden><div class="title-row"><h1>Products</h1><button class="add" id="newProduct">+ Add Product</button></div><div id="productList"></div></section><section id="banners" class="tab" hidden><h1>Banner & Home</h1><form id="bannerForm" class="form"><input name="hero_eyebrow" placeholder="Hero eyebrow"><input name="hero_title" placeholder="Hero title (HTML allowed)"><textarea name="hero_text" placeholder="Hero text"></textarea><input name="hero_button" placeholder="Hero button"><input name="hero_image" placeholder="Hero image URL"><hr><input name="banner_eyebrow" placeholder="Promo eyebrow"><input name="banner_title" placeholder="Promo title"><textarea name="banner_text" placeholder="Promo text"></textarea><input name="banner_button" placeholder="Promo button"><input name="banner_image" placeholder="Promo image URL"><button>Save Banner/Home</button></form></section><section id="settings" class="tab" hidden><h1>Website Settings</h1><form id="settingsForm" class="form"><input name="site_name" placeholder="Site name"><input name="logo_text" placeholder="Logo text"><input name="topbar" placeholder="Top bar"><input name="whatsapp" placeholder="WhatsApp number"><input name="facebook" placeholder="Facebook URL"><input name="about_title" placeholder="About title"><textarea name="about_text" placeholder="About text"></textarea><textarea name="contact_text" placeholder="Contact text"></textarea><div class="two"><input type="number" name="dhaka_delivery" placeholder="Dhaka delivery"><input type="number" name="outside_delivery" placeholder="Outside Dhaka delivery"></div><button>Save Settings</button></form></section><section id="orders" class="tab" hidden><h1>Orders</h1><div id="ordersList"></div></section></main></div></div><div class="modal" id="productModal"><div class="box"><button class="x" id="closeProduct">✕</button><h2 id="productTitle">Add Product</h2><form id="productForm" class="form"><input type="hidden" name="id"><input required name="name" placeholder="Product name"><input required name="category" placeholder="Category"><div class="two"><input required type="number" name="price" placeholder="Price"><input type="number" name="old_price" placeholder="Old price"></div><input name="image" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea><input type="number" name="stock" placeholder="Stock"><button>Save Product</button></form></div></div><script src="admin.js"></script></body></html>
